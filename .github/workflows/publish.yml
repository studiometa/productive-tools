# Release and publish in one run. The npm publish steps stay in this file
# because npm trusted publishing (OIDC, no npm token) is bound to the workflow
# file name. A tag pushed with GITHUB_TOKEN does not start other workflows, so
# the publish job runs here, after the release job.
#
# Each publish step skips a version that npm already has, so "Re-run failed
# jobs" on the publish job publishes the packages that a failed run missed.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (the pre* bumps create a prerelease)'
        type: choice
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]
        default: patch
      preid:
        description: 'Prerelease identifier, used by the pre* bumps only'
        type: choice
        options: [alpha, beta, rc]
        default: alpha

concurrency: release

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build all packages
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

  release:
    name: Bump version and changelog
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      # `npm ci` installs the Husky git hooks; the release commit skips them.
      HUSKY: '0'
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
      # Promoting a prerelease to a stable version can have no fragment.
      body: ${{ steps.changelog.outputs.changed == 'true' && steps.changelog.outputs.body || format('Stable release of {0}.', steps.version.outputs.previous) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The changelog action reads the commit that added each fragment.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Bump the root and every workspace package, and keep package-lock.json
      # in sync. A version with a prerelease part (`-`) goes to the `next`
      # dist-tag, any other version to `latest`.
      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          PREID: ${{ inputs.preid }}
        run: |
          PREVIOUS=$(node -p 'require("./package.json").version')
          npm version "$BUMP" --preid "$PREID" --workspaces --include-workspace-root --no-git-tag-version
          VERSION=$(node -p 'require("./package.json").version')
          {
            echo "previous=$PREVIOUS"
            echo "version=$VERSION"
            if [[ $VERSION == *-* ]]; then
              echo "prerelease=true"
              echo "tag=next"
            else
              echo "prerelease=false"
              echo "tag=latest"
            fi
            # A stable version after a prerelease promotes it.
            if [[ $PREVIOUS == *-* && $VERSION != *-* ]]; then
              echo "promotion=true"
            else
              echo "promotion=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Fold changelog fragments
        id: changelog
        uses: weareikko/changelog@600f4225cfd2778967eaffa693e86666c5a2d4bd # 1.0.2
        with:
          command: release
          version: ${{ steps.version.outputs.version }}

      # Promoting a prerelease (1.0.0-rc.1 → 1.0.0) can have no fragment: the
      # changelog then gets no new section.
      - name: Fail when there is nothing to release
        if: steps.changelog.outputs.changed != 'true' && steps.version.outputs.promotion != 'true'
        run: |
          echo "::error::No fragment in .changelog/: nothing to release."
          exit 1

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .changelog package.json package-lock.json packages/*/package.json
          git commit -m "Release $VERSION"
          git tag "$VERSION"
          git push origin HEAD:main "$VERSION"

  publish:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Sync inter-package versions
        run: node scripts/sync-versions.js

      # Trusted publishing (OIDC): no npm token. Each step skips a version that
      # npm already has. The steps run `npm publish --ignore-scripts`: no
      # package has publish lifecycle scripts, the build above makes `dist/`.
      - name: Publish @studiometa/productive-api
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/api
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.tag }}

      - name: Publish @studiometa/productive-core
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/core
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.tag }}

      - name: Publish @studiometa/productive-sdk
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/sdk
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.tag }}

      - name: Publish @studiometa/productive-cli
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/cli
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.tag }}

      - name: Publish @studiometa/productive-mcp
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/mcp
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.tag }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.release.outputs.version }}
          name: ${{ needs.release.outputs.version }}
          body: ${{ needs.release.outputs.body }}
          prerelease: ${{ needs.release.outputs.prerelease }}
          makeLatest: ${{ needs.release.outputs.prerelease == 'true' && 'false' || 'legacy' }}
          # A replay updates the release when a previous run created it.
          allowUpdates: true
